policy_id: heuristic_servo_goal_pose_v3_large_yaw_table_push_align_tuned
# Tuned variant of the table push-align strategy.
# Changes vs. base:
#   - more push-align time (120 steps)
#   - slightly higher above the object to reduce gripper-table collision
#   - faster yaw step
#   - stronger lateral oscillation to break static friction
#   - tighter alignment gate before committing to lift
type: heuristic_servo_goal_pose
strength: 0.7
memory_bonus: 0.0
skill_hints:
  - stabilize_lift
  - reduce_xy_motion
  - longer_gripper_close
  - verify_object_following
policy_config_dict:
  approach_offset_z: 0.10
  grasp_offset_z: 0.00
  lift_height: 0.3
  align_height_offset: 0.3
  lift_horizontal_scale: 0.0
  lift_max_delta: 0.12
  align_horizontal_scale: 0.2
  align_kp_multiplier: 0.5
  align_max_delta: 0.06
  release_at_target: false
  require_orientation_alignment: true
  kp: 3.0
  grasp_dist_threshold: 0.04
  gripper_close_threshold: 0.012
  min_grasp_steps: 30
  grasp_squeeze_steps: 15
  min_release_steps: 10
  approach_horizontal_threshold: 0.05
  max_state_steps: 3000
  success_threshold: 0.06
  orientation_threshold: 0.5
  lift_kp_multiplier: 1.0
  grasp_z_tolerance: 0.005
  fixed_target_quat: [0.0, 0.0, 0.7071, 0.7071]

  pre_grasp_orient: false
  grasp_target_yaw_offset: 1.5708
  pre_grasp_yaw_threshold: 0.2
  reorient_before_align: true
  reorient_height_offset: 0.3
  max_lift_delta_z: 0.08
  use_quaternion_orientation_target: false
  yaw_step_size: 0.10
  stabilize_steps_after_yaw: 10
  skip_broken_yaw_control: false

  verify_object_following_steps: 5
  object_following_distance_threshold: 0.10

  use_object_geometry_adaptation: true

  # Reachability-aware approach planner (promoted to default for v1.7).
  reachability_strategy: side_pregrasp_positive_y
  reachability_risk_estimator: true
  positive_y_workspace_risk: true
  reachability_positive_y_threshold: 0.01
  reachability_positive_yaw_threshold: 0.0
  high_pregrasp_z_offset: 0.25
  side_pregrasp_y_offset: -0.05
  side_pregrasp_z_offset: 0.15

  # Explicitly disabled so the trial tests table push-align in isolation.
  pre_grasp_yaw_align_v2: false
  pre_grasp_yaw_strategy: "target_yaw_before_grasp"
  pre_grasp_yaw_fraction: 0.8
  pre_grasp_yaw_max_step: 0.2
  pre_grasp_yaw_settle_steps: 3
  pre_grasp_yaw_safety_distance: 0.04
  post_grasp_yaw_residual_fraction: 0.2

  # Structural FailureToHint v3.1 regrasp controls disabled for this ablation.
  enable_regrasp: false
  structural_regrasp: false
  max_regrasp_attempts: 0
  regrasp_xy_offsets: null
  verify_lift_response_steps: 0
  min_lift_response_z: 0.01

  # Native Arena target yaw (pi/2).  The ablation runner overrides this with
  # the target-yaw matrix values.
  target_yaw_override: null

  # Table push-align strategy — tuned variant.
  large_yaw_strategy: "table_push_align"
  disable_inhand_reorient: false
  lift_height_before_yaw: 0.05
  table_push_align_table_z: null
  table_push_align_z_offset: 0.04
  table_push_align_max_steps: 120
  table_push_align_min_steps: 15
  table_push_align_orientation_threshold: 0.25
  table_push_align_yaw_step: 0.15
  table_push_align_lateral_amplitude: 0.01
  table_push_align_lateral_period: 20
  table_push_align_downward_kp: 0.5
  table_push_align_consecutive_aligned_steps: 8
  table_push_align_min_yaw_error: 0.5
