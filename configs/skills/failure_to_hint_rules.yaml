version: 0.1.0

rules:
  - failure_type: target_not_reached
    hints:
      - faster_approach
      - larger_servo_gain
    confidence: 0.7
    rationale: "The end-effector did not reach the object within the episode."

  - failure_type: policy_noop
    hints:
      - action_activation_check
    confidence: 0.9
    rationale: "The policy produced near-zero actions."

  - failure_type: grasp_failed
    hints:
      - grasp_adjust
      - slower_descent
      - longer_gripper_close
    confidence: 0.7
    rationale: "The end-effector reached the object but grasp was not successful."

  - failure_type: object_not_lifted
    hints:
      - longer_gripper_close
      - stronger_lift
      - stabilize_lift
    confidence: 0.7
    rationale: "The object was not lifted after grasp phase."

  - failure_type: target_not_reached_after_lift
    hints:
      - stronger_lift
      - target_tracking
    confidence: 0.6
    rationale: "The object was lifted but did not reach the command target."

  - failure_type: timeout
    hints:
      - efficient_execution
    confidence: 0.5
    rationale: "The task timed out before completion."
