id: goal_pose_procedural_cube_baseline
name: Goal Pose Procedural Cube Baseline
version: "1.0"
description: goal_pose with the default procedural_cube asset as an object-generalization baseline.
source: native
domain: manipulation
horizon: atomic
scene:
  name: table_simple
  domain: table
primitives:
  - name: Orient
    args:
      target: cube
objects:
  - name: cube
    category: graspable
    affordances: [graspable]
embodiment:
  robot: franka
  control_mode: ik
constraints: []
eval:
  max_steps: 300
  max_episodes: 5
  success_conditions: [pose_reached]
  metrics: [success_rate, completion_time]
mutation:
  allowed: [spatial, object, constraint]
  difficulty: 1
  seed: 42
tags: [table, atomic, pose]
metadata:
  difficulty: 1.0
  arena_env_args:
    environment: cube_goal_pose
    object: procedural_cube
    embodiment: franka_ik_abs
