schema_version: rosclaw.darwin.eval_spec.v1

id: libero_spatial_smoke
backend: lerobot_eval
runtime: libero

policy:
  path: ""
  device: cuda
  use_amp: false
  allow_network: false

environment:
  type: libero
  task: libero_spatial
  task_ids:
    - "0"
  batch_size: 1
  max_parallel_tasks: 1
  use_async_envs: false
  trust_remote_code: false

evaluation:
  n_episodes: 2
  start_seed: 42
  timeout_sec: 1800
  render_episodes: 2
  recording: false

output:
  root: data/eval_runs
  keep_raw: true
  keep_videos: true
  keep_worker_dir: false

validity_gates:
  require_eval_info: true
  require_expected_episode_count: true
  require_all_tasks_completed: true
  allow_nan_primary_metric: false

performance_gates:
  minimum_success_rate: null
  minimum_macro_task_success_rate: null
