services:
  darwin-mock:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: mock
    volumes:
      - .:/workspace/rosclaw-darwin
      - ./data:/data/rosclaw-darwin
    command: darwin dashboard --data /data/rosclaw-darwin --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"

  darwin-arena:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: arena
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      - .:/workspace/rosclaw-darwin
      - /data/repos:/data/repos
      - /data/models:/data/models
      - /data/datasets:/data/datasets
      - ./data:/data/rosclaw-darwin
    command: tail -f /dev/null
