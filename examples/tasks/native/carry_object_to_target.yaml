id: darwin_mvp_11_carry_object_to_target
name: Carry Object To Target
description: Carry Object To Target task.
source: native
domain: loco_manipulation
horizon: short

scene:
  name: default
  domain: loco_manipulation

embodiment:
  robot: unitree_g1
  control_mode: whole_body

objects:
  - name: cube
    affordances: [graspable]
  - name: table
    affordances: [surface]
  - name: bin
    affordances: [container]

primitives:
  - name: grasp
  - name: navigate_to
  - name: place

eval:
  success_conditions:
    - task_completed
  failure_conditions:
    - timeout
  metrics:
    - success_rate
    - completion_time
  max_steps: 1000
  max_episodes: 20

mutation:
  allowed:
    - spatial
    - object
    - constraint
  difficulty: 1

tags:
  - mvp
  - loco_manipulation

metadata:
  arena_env_args:
    environment: cube_goal_pose
    object: procedural_cube
    background: procedural_table
