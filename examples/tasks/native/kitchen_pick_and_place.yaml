id: darwin_kitchen_pick_and_place_cube
name: Kitchen Pick and Place Cube
description: Pick a cube and place it on a target in the kitchen.
source: native
domain: kitchen
horizon: short

scene:
  name: kitchen
  domain: kitchen

embodiment:
  robot: franka
  control_mode: ik

objects:
  - name: cube
    affordances: [graspable]
  - name: table
    affordances: [surface]

primitives:
  - name: pick
  - name: place

eval:
  success_conditions:
    - object_placed
  failure_conditions:
    - timeout
    - object_dropped
  metrics:
    - success_rate
    - completion_time
  max_steps: 1000
  max_episodes: 20

execution:
  executable: true
  backend: arena
  mode: docker
  requires_gpu: true
  requires_docker: true
  native_env_name: kitchen_pick_and_place
  adapter: arena

mutation:
  allowed:
    - spatial
    - object
    - constraint
  difficulty: 1

tags:
  - kitchen
  - manipulation
