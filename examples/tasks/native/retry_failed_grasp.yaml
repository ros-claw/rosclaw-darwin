id: darwin_mvp_18_retry_failed_grasp
name: Retry Failed Grasp
description: Retry Failed Grasp task.
source: native
domain: failure_recovery
horizon: atomic

scene:
  name: default
  domain: failure_recovery

embodiment:
  robot: unitree_g1
  control_mode: whole_body

objects:
  - name: cube
    affordances: [graspable]

primitives:
  - name: grasp
  - name: retry

eval:
  success_conditions:
    - task_completed
  failure_conditions:
    - timeout
  metrics:
    - success_rate
    - completion_time
  max_steps: 1000
  max_episodes: 20

mutation:
  allowed:
    - spatial
    - object
    - constraint
  difficulty: 1

tags:
  - mvp
  - failure_recovery
