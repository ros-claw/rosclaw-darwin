id: darwin_mvp_03_lift_object
name: Lift Object
description: Lift Object task.
source: native
domain: manipulation
horizon: atomic

scene:
  name: default
  domain: manipulation

embodiment:
  robot: franka
  control_mode: ik

objects:
  - name: cube
    affordances: [graspable]

primitives:
  - name: Lift

eval:
  success_conditions:
    - task_completed
  failure_conditions:
    - timeout
  metrics:
    - success_rate
    - completion_time
  max_steps: 1000
  max_episodes: 20

mutation:
  allowed:
    - spatial
    - object
    - constraint
  difficulty: 1

metadata:
  arena_env_args:
    environment: lift_object
    object: dex_cube
    embodiment: franka_ik

tags:
  - mvp
  - manipulation
