id: darwin_mvp_01_pick_object
name: Pick Object
description: Pick Object task.
source: native
domain: manipulation
horizon: atomic

scene:
  name: default
  domain: manipulation

embodiment:
  robot: unitree_g1
  control_mode: whole_body

objects:
  - name: cube
    affordances: [graspable]

primitives:
  - name: grasp

eval:
  success_conditions:
    - task_completed
  failure_conditions:
    - timeout
  metrics:
    - success_rate
    - completion_time
  max_steps: 1000
  max_episodes: 20

mutation:
  allowed:
    - spatial
    - object
    - constraint
  difficulty: 1

tags:
  - mvp
  - manipulation
