[project]
name = "rosclaw-darwin"
version = "0.1.0"
description = "Evolutionary benchmark layer for embodied agents"
readme = "README.md"
requires-python = ">=3.10"

authors = [
  {name = "ROSClaw Team"},
]

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "pydantic>=2.0",
  "typer>=0.12",
  "rich>=13.0",
  "pyyaml>=6.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "networkx>=3.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "jinja2>=3.1",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
arena = [
  "gymnasium",
  "torch",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff",
  "mypy",
  "pre-commit",
]

[project.scripts]
darwin = "rosclaw_darwin.cli.darwin_app:darwin_app"
rosclaw-darwin = "rosclaw_darwin.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["rosclaw_darwin*"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["rosclaw_darwin/evaluation/arena_docker_deps"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"rosclaw_darwin/adapters/arena.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
